<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مينا تحبني؟</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#f8e5ea,#f8eee7);
overflow:hidden;
}

.card{
background:white;
width:340px;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card img{
width:180px;
margin-bottom:15px;
}

h2{
color:#e66a8d;
font-size:38px;
margin-bottom:20px;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
}

button{
border:none;
padding:12px 28px;
border-radius:20px;
font-size:20px;
cursor:pointer;
}

.yes{
background:#ff5f8e;
color:white;
}

.no{
background:#ddd;
}

.result{
font-size:45px;
color:#ff5f8e;
text-align:center;
}
</style>
</head>

<body>

<div class="card">
<img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=300" alt="cats">

<h2>مينا تحبني ؟</h2>

<div class="buttons">
<button class="yes" onclick="love()">إي</button>
<button class="no" id="noBtn">لا</button>
</div>
</div>

<script>
function love(){
document.body.innerHTML =
'<div class="result">❤️ أحبج مينا ❤️</div>';
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover",()=>{
noBtn.style.position="absolute";
noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
});
</script>

</body>
</html>
